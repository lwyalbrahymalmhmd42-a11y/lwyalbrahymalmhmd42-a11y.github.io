<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الهاشمي | متجر الشحن</title>
    <meta name="description" content="متجر شحن الألعاب والتطبيقات والدفع عبر شام كاش" />
    <style>
        :root {
            --primary: #0f2b5c;
            --primary-2: #0b1738;
            --blue: #153a77;
            --blue-soft: #1f4ca6;
            --card: #0d1f45;
            --card-2: #0a1733;
            --gold: #f7c75b;
            --text: #0f172a;
            --muted: #49576b;
            --white: #ffffff;
            --shadow: 0 14px 28px rgba(10, 20, 40, 0.18);
            --nav-gray: #edf1f7;
            --bottom-bar: #f7f7f8;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #dfe7f7;
            color: var(--text);
            line-height: 1.5;
        }
        a { text-decoration: none; color: inherit; }
        .container { width: min(1180px, calc(100% - 30px)); margin: 0 auto; }

        .app-shell {
            width: min(100%, 500px);
            min-height: 100vh;
            margin: 0 auto;
            background: linear-gradient(180deg, #eef3ff 0%, #edf1f7 100%);
            box-shadow: 0 10px 40px rgba(18, 28, 50, 0.12);
            position: relative;
            padding-bottom: 92px;
        }

        .topbar {
            background: linear-gradient(180deg, #eaf0ff 0%, #dfeafc 100%);
            border-bottom: 1px solid rgba(15, 43, 92, 0.08);
            padding: 10px 18px 16px;
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #0a1e44;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .signal {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 18px;
        }
        .status-right { gap: 10px; }
        .battery {
            width: 27px;
            height: 14px;
            border-radius: 4px;
            border: 2px solid #0b1e4a;
            position: relative;
            display: inline-block;
            background: linear-gradient(90deg, #1d315f 0 65%, #11274d 65% 100%);
        }
        .battery::after {
            content: "";
            position: absolute;
            right: -4px;
            top: 3px;
            width: 3px;
            height: 6px;
            border-radius: 2px;
            background: #0b1e4a;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 4px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0d2a5d;
        }
        .brand-mark {
            width: 52px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0e2d6a, #0a244d);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 900;
            font-size: 1.65rem;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
            position: relative;
        }
        .brand-mark::before {
            content: "5";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 1.7rem;
            color: #fff;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        .brand-name small {
            display: block;
            font-size: 0.62rem;
            letter-spacing: 0.09em;
            opacity: 0.8;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(180deg, #f5f5f5, #e7ebf1);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
            display: grid;
            place-items: center;
            color: #0d2d68;
            font-size: 1.1rem;
        }
        .badge-alert {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff584d, #f23d3d);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 900;
            display: grid;
            place-items: center;
            box-shadow: 0 6px 12px rgba(242, 61, 61, 0.3);
        }
        .vip-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #0d1d40, #122e64);
            color: #fff;
            border-radius: 16px;
            padding: 8px 14px;
            font-weight: 800;
            font-size: 0.8rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        .vip-tag .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffd266;
            box-shadow: 0 0 0 3px rgba(255, 210, 102, 0.2);
        }
        .balance-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.66);
            border: 1px solid rgba(9, 24, 47, 0.08);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 800;
            color: #0f172a;
        }
        .balance-box .coin {
            font-size: 1.15rem;
        }
        .menu {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255,255,255,0.65);
            display: grid;
            place-items: center;
            color: #0f2b5c;
            font-size: 1.5rem;
        }

        .store-wrap {
            padding: 18px 14px 0;
        }
        .store-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px 14px;
        }
        .store-item {
            text-align: center;
            color: #0b1734;
        }
        .store-thumb {
            position: relative;
            height: 118px;
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(135deg, #0d1b3d, #163b7e 40%, #10295d 100%);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.16);
            display: grid;
            place-items: center;
        }
        .store-thumb::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent 30%, rgba(0,0,0,0.16));
        }
        .store-thumb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(80, 162, 255, 0.25), transparent 50%);
        }
        .store-item:nth-child(2n) .store-thumb { background: linear-gradient(135deg, #0a1d45, #123b7c 28%, #0a2b70 100%); }
        .store-item:nth-child(3n) .store-thumb { background: linear-gradient(135deg, #0b1f4d, #113f8e 26%, #0a2b5c 100%); }
        .store-logo {
            position: relative;
            z-index: 1;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #fff;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            font-size: 1.7rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .store-logo.gaming { background: linear-gradient(135deg, #ff5bc6, #ffaf3d); }
        .store-logo.app { background: linear-gradient(135deg, #7bd6ff, #4c87ff); }
        .store-logo.card { background: linear-gradient(135deg, #7dffdb, #2bcf9d); }
        .store-logo.media { background: linear-gradient(135deg, #ff7da1, #ff4ea8); }
        .store-logo.social { background: linear-gradient(135deg, #7de0ff, #2bb0ff); }
        .store-logo.account { background: linear-gradient(135deg, #79c3ff, #56c5ff); }
        .store-logo.soft { background: linear-gradient(135deg, #3cd6f0, #142f7b); }
        .store-logo.premium { background: linear-gradient(135deg, #a5ed86, #2dcf74); }
        .store-logo.tv { background: linear-gradient(135deg, #f7d15a, #f28b2c); }
        .store-logo.design { background: linear-gradient(135deg, #b7d5ff, #5c86ff); }
        .store-logo.numbers { background: linear-gradient(135deg, #ffda98, #ff9b48); }
        .store-logo.vpn { background: linear-gradient(135deg, #5fd4ff, #56ce8a); }

        .store-label {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.35;
            color: #111827;
            word-break: break-word;
        }

        .bottom-nav {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: min(100%, 500px);
            background: rgba(247,247,248,0.94);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(10,20,40,0.08);
            padding: 12px 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -10px 24px rgba(8, 14, 28, 0.08);
            z-index: 20;
        }
        .nav-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #94a3b8;
            font-size: 1.9rem;
            background: transparent;
        }
        .nav-icon.active {
            background: linear-gradient(135deg, rgba(13, 70, 167, 0.15), rgba(13, 70, 167, 0.06));
            color: #0d2d68;
            box-shadow: inset 0 0 0 1px rgba(13, 70, 167, 0.12);
            position: relative;
        }
        .nav-icon.active::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 10px 18px rgba(18, 36, 72, 0.08);
        }
        .nav-icon.home { font-size: 2rem; }
        .nav-icon.cart { font-size: 1.8rem; }

        @media (max-width: 470px) {
            .app-shell { width: 100%; }
            .store-grid { gap: 14px 10px; }
            .store-thumb { height: 105px; }
            .store-label { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="status-row">
                <div class="status-left">
                    <span class="signal">◔</span>
                    <span>4G</span>
                </div>
                <div class="status-right">
                    <span>3:04</span>
                    <span class="battery" aria-label="battery"></span>
                </div>
            </div>

            <div class="brand-row">
                <div class="brand" aria-label="الهاشمي">
                    <div class="brand-mark" aria-hidden="true"></div>
                    <div class="brand-name">Tartous<small>market</small></div>
                </div>

                <div class="header-actions">
                    <div class="badge" aria-label="الإشعارات">
                        🔔
                        <span class="badge-alert">48</span>
                    </div>
                    <div class="vip-tag"><span class="dot"></span> VIP1</div>
                    <div class="balance-box"><span class="coin">$</span> 0.021</div>
                    <div class="menu" aria-label="القائمة">☰</div>
                </div>
            </div>
        </header>

        <main class="store-wrap">
            <div class="store-grid">
                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo gaming">💳</div>
                    </div>
                    <div class="store-label">الرصيد<br />والعمولات</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo app">📱</div>
                    </div>
                    <div class="store-label">التطبيقات</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo gaming">🎮</div>
                    </div>
                    <div class="store-label">الألعاب</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo card">💸</div>
                    </div>
                    <div class="store-label">البطاقات</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo social">📣</div>
                    </div>
                    <div class="store-label">السوشيال<br />ميديا</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo account">👤</div>
                    </div>
                    <div class="store-label">حسابات<br />جاهزة</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo soft">🧩</div>
                    </div>
                    <div class="store-label">برامج</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo premium">✅</div>
                    </div>
                    <div class="store-label">تفعيل<br />الحسابات</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo tv">📺</div>
                    </div>
                    <div class="store-label">اشتراكات<br />الشاشة</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo design">🖌️</div>
                    </div>
                    <div class="store-label">تطبيقات<br />تصميم</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo numbers">☎️</div>
                    </div>
                    <div class="store-label">أرقام</div>
                </div>

                <div class="store-item">
                    <div class="store-thumb">
                        <div class="store-logo vpn">🔒</div>
                    </div>
                    <div class="store-label">VPN</div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav" aria-label="التنقل السفلي">
            <div class="nav-icon home active">⌂</div>
            <div class="nav-icon">◫</div>
            <div class="nav-icon">◍</div>
            <div class="nav-icon cart">🛒</div>
        </nav>
    </div>
</body>
</html>
